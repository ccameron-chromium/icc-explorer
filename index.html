<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; }
  #hex-dump { overflow-y: scroll; font-family: monospace; white-space: pre; padding: 10px; background: #f0f0f0; flex: 0 0 auto; }
  #results { flex: 1; overflow-y: scroll; padding: 10px; }
  .hl-0 { background: yellow; }
  .hl-1 { background: #e0e0ff; }
  .hl-2 { background: #e0ffe0; }
  .hl-3 { background: #ffe0e0; }
  .hl-4 { background: #f0e0ff; }
  .hl-5 { background: #fff0e0; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
  th, td { border: 1px solid #ccc; padding: 4px; text-align: left; }
  table table { margin-bottom: 0; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #eee; }
  td:first-child { font-weight: bold; width: 25%; white-space: nowrap; }
  td:last-child { font-family: monospace; word-break: break-all; }
  .toggle { cursor: pointer; user-select: none; margin-right: 5px; display: inline-block; width: 10px; text-align: center; }
  .row-hidden { display: none; }
</style>
<script>
let profileBuffer = null;

class Reader {
  constructor(view, offset = 0) {
    this.view = view;
    this.offset = offset;
  }

  getBufferOffset() {
    return this.view.byteOffset + this.offset;
  }

  readValue(type) {
    return dataTypes[type].read(this);
  }

  readStructMember(entry, structure) {
    let count = 1;
    if (typeof entry.count === 'string') {
      const prev = structure.find(r => r.name === entry.count);
      count = prev ? prev.value : 0;
    } else if (entry.count !== undefined) {
      count = entry.count;
    }

    let offsetToRestore = null;
    let newOffset = null;
    if (typeof entry.offset === 'string') {
      offsetToRestore = this.offset;
      newOffset = structure.find(r => r.name === entry.offset).value;
      if (newOffset === 0) {
        return;
      }
      this.offset = newOffset;
    }

    let viewToRestore = null;
    let newSize = null;
    if (entry.size !== undefined) {
      newSize = structure.find(r => r.name === entry.size).value;
      viewToRestore = this.view;
      this.view = new DataView(this.view.buffer, this.view.byteOffset + this.offset, newSize)
      this.offset = 0;
    }


    const typeDef = dataTypes[entry.type];
    const limit = (count === 0) ? Infinity : count;
    for (let i = 0; i < limit; ++i) {
      if (count === 0 && this.offset >= this.view.byteLength) break;

      const childOffsetStart = this.getBufferOffset();
      const childName = (entry.count === undefined) ?
        entry.name : `${entry.name}[${i}]`;

      let value = this.readValue(entry.type);
      const childOffsetEnd = this.getBufferOffset();
      const childSize = newSize === null ? childOffsetEnd - childOffsetStart : newSize;

      structure.push({
        name: childName,
        value: value,
        offset: childOffsetStart,
        size: childSize
      });

      if (childSize === 0 && limit === Infinity) break;
    }

    if (viewToRestore !== null) {
      this.view = viewToRestore;
    }
    if (offsetToRestore !== null) {
      this.offset = offsetToRestore;
    }
  }
}

function readStructureInto(reader, members, structureLayout) {
  for (let memberLayout of structureLayout) {
    reader.readStructMember(memberLayout, members);
  }
}

function readStructure(reader, structureLayout) {
  let children = [];
  readStructureInto(reader, children, structureLayout);
  return children;
}

function readLutType(reader) {
  const startOffset = reader.offset;
  let structure = readStructure(reader, [
    {name: 'Type',                      type: 'fourcc'},
    {name: 'Reserved',                  type: 'uint32'},
    {name: 'Number of input channels',  type: 'uint8'},
    {name: 'Number of output channels', type: 'uint8'},
    {name: 'Reserved',                  type: 'uint16'},
    {name: 'Offset to B curves',        type: 'uint32'},
    {name: 'Offset to matrix',          type: 'uint32'},
    {name: 'Offset to M curves',        type: 'uint32'},
    {name: 'Offset to CLUT',            type: 'uint32'},
    {name: 'Offset to A curves',        type: 'uint32'},
  ]);

  const inputChannels = getStructMember(structure, 'Number of input channels').value;
  const outputChannels = getStructMember(structure, 'Number of output channels').value;

  reader.readStructMember({name: 'B curve', type:'(tag)',    offset:'Offset to B curves', count:inputChannels}, structure);
  reader.readStructMember({name: 'Matrix',  type:'(matrix)', offset:'Offset to matrix'}, structure);
  reader.readStructMember({name: 'M curve', type:'(tag)',    offset:'Offset to M curves', count:3}, structure);

  const clutOffset = getStructMember(structure, 'Offset to CLUT').value;
  if (clutOffset !== 0) {
    const oldOffset = reader.offset;
    reader.offset = clutOffset;
    const clutStructure = readStructure(reader, [
      {name: 'Grid points', type: 'uint8', count: 16},
      {name: 'Precision',   type: 'uint8'},
      {name: 'Reserved',    type: 'uint8', count: 3},
    ]);
    const precision = getStructMember(clutStructure, 'Precision').value;
    let tableSize = (precision === 1 ? 1 : 2) * outputChannels;
    for (let i = 0; i < inputChannels; ++i) {
      tableSize *= getStructMember(clutStructure, `Grid points[${i}]`).value;
    }
    clutStructure.push({
      name: 'Data',
      value: '[table]',
      offset: reader.getBufferOffset(),
      size: tableSize
    });
    structure.push({
      name: 'CLUT',
      value: clutStructure,
      offset: clutOffset,
      size: reader.offset + tableSize - clutOffset
    });
    reader.offset = oldOffset;
  }

  reader.readStructMember({name: 'A curve', type:'(tag)',    offset:'Offset to A curves', count:outputChannels}, structure);

  return structure;
}

function readStructureType(structure) {
  return (reader) => {
    return readStructure(reader, structure);
  };
}

let tagTypes = {
  'XYZ ': {
    read: readStructureType([
      {name: 'Type', type: 'fourcc'},
      {name: 'Reserved', type: 'uint32'},
      {name: 'XYZ', type: 'XYZNumber'}
    ])
  },
  'text': {
    read: (reader) => {
      const structure = readStructure(reader, [
        {name: 'Type', type: 'fourcc'},
        {name: 'Reserved', type: 'uint32'},
      ]);
      const startOffset = reader.getBufferOffset();
      const byteLength = reader.view.byteLength - reader.offset;
      let value = '';
      for (let i = 0; i < byteLength; ++i) {
        value += String.fromCharCode(reader.view.getUint8(reader.offset + i));
      }
      structure.push({
        name: 'ASCII',
        value: value,
        offset: startOffset,
        size: byteLength
      });
      reader.offset += byteLength;
      return structure;
    }
  },
  'desc': {
    read: (reader) => {
      const structure = readStructure(reader, [
        {name: 'Type', type: 'fourcc'},
        {name: 'Reserved', type: 'uint32'},
        {name: 'ASCII length', type: 'uint32'},
      ]);
      const length = getStructMember(structure, 'ASCII length').value;
      const startOffset = reader.getBufferOffset();
      let value = '';
      for (let i = 0; i < length; ++i) {
        const b = reader.view.getUint8(reader.offset + i);
        if (b === 0) break;
        value += String.fromCharCode(b);
      }
      structure.push({
        name: 'ASCII',
        value: value,
        offset: startOffset,
        size: length
      });
      reader.offset += length;
      // Note: textDescriptionType continues with Unicode and ScriptCode, 
      // but we'll stop here as the ASCII part is usually what's wanted.
      return structure;
    }
  },
  'hagc': {
    read: (reader) => {
      const structure = readStructure(reader, [
        {name: 'Type', type: 'fourcc'},
        {name: 'Reserved', type: 'uint32'},
      ]);
      const startOffset = reader.getBufferOffset();
      const byteLength = reader.view.byteLength - reader.offset;
      const hexValues = [];
      for (let i = 0; i < byteLength; ++i) {
        hexValues.push('0x' + reader.view.getUint8(reader.offset + i).toString(16).padStart(2, '0'));
      }
      structure.push({
        name: 'Data',
        value: hexValues.join(','),
        offset: startOffset,
        size: byteLength
      });
      reader.offset += byteLength;
      return structure;
    }
  },
  'curv': {
    read: (reader) => {
      const structure = readStructure(reader, [
        {name: 'Type', type: 'fourcc'},
        {name: 'Reserved', type: 'uint32'},
        {name: 'Count', type: 'uint32'},
      ]);
      const count = getStructMember(structure, 'Count').value;

      if (count === 0) {
        structure.push({ name: 'Function', value: 'Identity', offset: reader.getBufferOffset(), size: 0 });
      } else if (count === 1) {
        reader.readStructMember({name: 'Gamma', type: 'u8Fixed8Number-but-from-16'}, structure);
      } else {
        const tableStartOffset = reader.getBufferOffset();
        const values = [];
        for (let i = 0; i < count; ++i) {
          values.push(reader.readValue('uint16'));
        }
        const tableEndOffset = reader.getBufferOffset();
        const value = '[table]'; // values.join(', ');
        structure.push({ name: 'Table', value: value, offset: tableStartOffset, size: tableEndOffset - tableStartOffset });
      }
      return structure;
    }
  },
  'para': {
    read: (reader) => {
      const structure = readStructure(reader, [
        {name: 'Type', type: 'fourcc'},
        {name: 'Reserved', type: 'uint32'},
        {name: 'Function Type', type: 'uint16'},
        {name: 'Reserved2', type: 'uint16'},
      ]);
      const functionType = getStructMember(structure, 'Function Type').value;
      const paramNames = [
        ['g'],                              // Type 0
        ['g', 'a', 'b'],                    // Type 1
        ['g', 'a', 'b', 'c'],               // Type 2
        ['g', 'a', 'b', 'c', 'd'],          // Type 3
        ['g', 'a', 'b', 'c', 'd', 'e', 'f'] // Type 4
      ];
      
      const names = paramNames[functionType] || [];
      for (const name of names) {
        reader.readStructMember({name: name, type: 's15Fixed16Number'}, structure);
      }
      return structure;
    }
  },
  'cicp': {
    read: readStructureType([
      {name: 'Type', type: 'fourcc'},
      {name: 'Reserved', type: 'uint32'},
      {name: 'Color Primaries', type: 'uint8'},
      {name: 'Transfer Characteristics', type: 'uint8'},
      {name: 'Matrix Coefficients', type: 'uint8'},
      {name: 'Video Full Range Flag', type: 'uint8'}
    ])
  },
  'wtpt': {
    read: readStructureType([
      {name: 'Type', type: 'fourcc'},
      {name: 'Reserved', type: 'uint32'},
      {name: 'XYZ', type: 'XYZNumber'}
    ])
  },
  'mluc': {
    read: readStructureType([
      {name: 'Type', type: 'fourcc'},
      {name: 'Reserved', type: 'uint32'},
      {name: 'Number of records', type: 'uint32'},
      {name: 'Record size', type: 'uint32'},
      {name: 'Record', type: '(mluc record)', count: 'Number of records'},
    ])
  },
  'mAB ': {
    read: (reader) => {
      return readLutType(reader);
    }
  },
  'mBA ': {
    read: (reader) => {
      return readLutType(reader);
    }
  },
  'hagc': {
    read: (reader) => {
      const structure = readStructure(reader, [
        {name: 'Type', type: 'fourcc'},
        {name: 'Reserved', type: 'uint32'},
        {name: 'Number of bytes', type: 'uint32'},
      ]);

      const count = getStructMember(structure, 'Number of bytes').value;
      const bytesStartOffset = reader.getBufferOffset();
      const values = [];
      for (let i = 0; i < count; ++i) {
        values.push(reader.readValue('uint8'));
      }
      const bytesEndOffset = reader.getBufferOffset();
      const value = '[bytes]'; // values.join(', ');
      structure.push({ name: 'Bytes', value: value, offset: bytesStartOffset, size: bytesEndOffset - bytesStartOffset });
      return structure;
    }
  },
};

let dataTypes = {
  ////////////////////////////////////////////////////////////////////////////////
  // Leaf node types.
  
  'uint8': {
    read: (reader) => {
      const v = reader.view.getUint8(reader.offset);
      reader.offset += 1;
      return v;
    }
  },
  'twocc': {
    read: (reader) => {
      const v = String.fromCharCode(reader.view.getUint8(reader.offset),
                                     reader.view.getUint8(reader.offset + 1));
      reader.offset += 2;
      return v;
    }
  },
  'uint16': {
    read: (reader) => {
      const v = reader.view.getUint16(reader.offset, false);
      reader.offset += 2;
      return v;
    }
  },
  'uint32': {
    read: (reader) => {
      const v = reader.view.getUint32(reader.offset, false);
      reader.offset += 4;
      return v;
    }
  },
  's15Fixed16Number': {
    read: (reader) => {
      const v = (reader.view.getInt32(reader.offset, false) / 65536.0).toFixed(4);
      reader.offset += 4;
      return v;
    }
  },
  'u8Fixed8Number-but-from-16': {
    read: (reader) => {
      const v = (reader.view.getUint16(reader.offset, false) / 256.0).toFixed(4);
      reader.offset += 2;
      return v;
    }
  },
  'bitfield32': {
    read: (reader) => {
      const v = '0x' + reader.view.getUint32(reader.offset, false).toString(16).padStart(8, '0');
      reader.offset += 4;
      return v;
    }
  },
  'bitfield64': {
    read: (reader) => {
      const v = '0x' + reader.view.getUint32(reader.offset, false).toString(16).padStart(8, '0') +
             reader.view.getUint32(reader.offset + 4, false).toString(16).padStart(8, '0');
      reader.offset += 8;
      return v;
    }
  },
  'fourcc': {
    read: (reader) => {
      let s = '';
      for (let i = 0; i < 4; ++i) {
        let c = reader.view.getUint8(reader.offset + i);
        s += c >= 32 && c <= 126 ?
          String.fromCharCode(c) :
          '\\x' + c.toString(16).padStart(2, '0');
      }
      reader.offset += 4;
      return s;
    }
  },
  'md5': {
    read: (reader) => {
      let s = '';
      for (let i = 0; i < 16; ++i) {
        s += reader.view.getUint8(reader.offset + i).toString(16).padStart(2, '0');
      }
      reader.offset += 16;
      return s;
    }
  },

  ////////////////////////////////////////////////////////////////////////////////
  // Internal node types.

  'dateTimeNumber': {
    read: readStructureType([
      { name: 'year', type: 'uint16' },
      { name: 'month', type: 'uint16' },
      { name: 'day', type: 'uint16' },
      { name: 'hours', type: 'uint16' },
      { name: 'minutes', type: 'uint16' },
      { name: 'seconds', type: 'uint16' }
    ])
  },
  'XYZNumber': {
    read: readStructureType([
      { name: 'X', type: 's15Fixed16Number' },
      { name: 'Y', type: 's15Fixed16Number' },
      { name: 'Z', type: 's15Fixed16Number' }
    ])
  },

  '(matrix)': {
    read: readStructureType([
      { name: 'm11', type: 's15Fixed16Number' },
      { name: 'm12', type: 's15Fixed16Number' },
      { name: 'm13', type: 's15Fixed16Number' },
      { name: 'm21', type: 's15Fixed16Number' },
      { name: 'm22', type: 's15Fixed16Number' },
      { name: 'm23', type: 's15Fixed16Number' },
      { name: 'm31', type: 's15Fixed16Number' },
      { name: 'm32', type: 's15Fixed16Number' },
      { name: 'm33', type: 's15Fixed16Number' },
      { name: 'v1',  type: 's15Fixed16Number' },
      { name: 'v2',  type: 's15Fixed16Number' },
      { name: 'v3',  type: 's15Fixed16Number' }
    ])
  },

  '(mluc record)': {
    read: (reader) => {
      let structure = readStructure(reader, [
        {name: 'language code', type: 'twocc'},
        {name: 'country code', type: 'twocc'},
        {name: 'length', type: 'uint32'},
        {name: 'offset', type: 'uint32'},
      ]);

      const length = getStructMember(structure, 'length').value;
      const dataOffset = getStructMember(structure, 'offset').value;
      let value = '';
      for (let i = 0; i < length; i += 2) {
        value += String.fromCharCode(reader.view.getUint16(dataOffset + i, false));
      }
      structure.push({ name: 'Value', value: value, offset: dataOffset, size: length });
      return structure;
    }
  },
  '(tag table entry)': {
    read: (reader) => {
      let structure = readStructure(reader, [
        {name: 'signature', type: 'fourcc'},
        {name: 'offset', type: 'uint32'},
        {name: 'size', type: 'uint32'},
        {name: 'Data', type: '(tag)', offset:'offset', size:'size'},
      ]);
      return structure;
    }
  },
  '(tag)': {
    read: (reader) => {
      const tagSignature = dataTypes['fourcc'].read(reader);
      reader.offset -= 4;
      const typeDef = tagTypes[tagSignature];
      if (typeDef && typeDef.read) {
        return typeDef.read(reader);
      }
      return [
        { name: 'Unknown tag', value: tagSignature, offset: 0, size: 0 },
        { name: 'Data', value: `[bytes]`, offset: 0, size: 0 }
      ];
    }
  }
};

let headerStructure = [
  {name: 'Profile size', type: 'uint32'},
  {name: 'Preferred CMM type', type: 'fourcc'},
  {name: 'Profile version number', type: 'uint8', count: 4},
  {name: 'Profile/Device class', type: 'fourcc'},
  {name: 'Colour space of data', type: 'fourcc'},
  {name: 'PCS', type: 'fourcc'},
  {name: 'Date and time', type: 'dateTimeNumber'},
  {name: 'Profile file signature', type: 'fourcc'},
  {name: 'Primary platform', type: 'fourcc'},
  {name: 'Profile flags', type: 'bitfield32'},
  {name: 'Device manufacturer', type: 'fourcc'},
  {name: 'Device model', type: 'fourcc'},
  {name: 'Device attributes', type: 'bitfield64'},
  {name: 'Rendering intent', type: 'uint32'},
  {name: 'PCS illuminant', type: 'XYZNumber'},
  {name: 'Profile creator', type: 'fourcc'},
  {name: 'Profile ID', type: 'md5'},
  {name: 'Reserved', type: 'uint32', count: 7},
  {name: 'Tag count', type: 'uint32'},
  {name: 'Tags', type: '(tag table entry)', count: 'Tag count'}
];

function getStructMember(structure, name) {
  return structure.find(r => r.name === name);
}

function loadProfile(buffer) {
  profileBuffer = buffer;
  displayHex(buffer);

  const reader = new Reader(new DataView(buffer), 0);
  let profileResults = readStructure(reader, headerStructure);

  displayResults([{ title: 'Profile', data: profileResults }]);
}

function displayHex(buffer, highlights = []) {
  const bytes = new Uint8Array(buffer);
  const getHlClass = (idx) => {
    for (let i = 0; i < highlights.length; i++) {
      const hl = highlights[i];
      if (idx >= hl.offset && idx < hl.offset + hl.size) {
        return `hl-${i}`;
      }
    }
    return null;
  };

  let html = '';
  for (let i = 0; i < bytes.length; i += 16) {
    html += i.toString(16).padStart(8, '0') + ': ';
    let hexPart = '';
    let asciiPart = '';
    
    for (let j = 0; j < 16; j++) {
      const idx = i + j;
      if (idx < bytes.length) {
        const b = bytes[idx];
        const hex = b.toString(16).padStart(2, '0');
        const cls = getHlClass(idx);
        
        if (cls) {
          const id = (i === 0 && j === 0 && highlights[0] && idx === highlights[0].offset) || (highlights[0] && idx === highlights[0].offset) ? ` id="hl-target"` : '';
          hexPart += `<span class="${cls}"${id}>${hex}</span>`;
        } else {
          hexPart += hex;
        }

        let char = String.fromCharCode(b);
        if (b === 38) char = '&amp;';
        else if (b === 60) char = '&lt;';
        else if (b === 62) char = '&gt;';
        
        let asciiChar = '';
        if (b >= 32 && b <= 126) {
          asciiChar = char;
        } else {
          asciiChar = '<span style="color: #ccc;">.</span>';
        }

        if (cls) {
          asciiPart += `<span class="${cls}">${asciiChar}</span>`;
        } else {
          asciiPart += asciiChar;
        }

        if (j < 15) {
          if (idx + 1 < bytes.length) {
            const c1 = getHlClass(idx);
            const c2 = getHlClass(idx + 1);
            if (c1 && c2 && c1 === c2) {
              hexPart += `<span class="${c1}">,</span>`;
            } else {
              hexPart += ',';
            }
          } else {
            hexPart += ' ';
          }
        }
      } else {
        hexPart += '  ';
        if (j < 15) hexPart += ' ';
      }
    }
    html += hexPart + '  ' + asciiPart + '\n';
  }
  const container = document.getElementById('hex-dump');
  container.innerHTML = html;
  
  const target = document.getElementById('hl-target');
  if (target) target.scrollIntoView({block: 'center'});
}

function displayResults(sections) {
  const container = document.getElementById('results');
  container.innerHTML = '';

  const addRows = (table, data, depth = 0, ancestors = []) => {
    const allDescendantRows = [];
    for (let res of data) {
      const row = table.insertRow();
      row.className = 'clickable';
      res.row = row;
      allDescendantRows.push(row);
      
      const currentPath = [res, ...ancestors];
      
      row.onclick = (e) => {
        e.stopPropagation();
        const allRows = container.getElementsByTagName('tr');
        for (let r of allRows) {
          for (let i = 0; i < 6; i++) {
            r.classList.remove(`hl-${i}`);
          }
        }
        displayHex(profileBuffer, currentPath);
        for (let i = 0; i < currentPath.length; i++) {
          if (currentPath[i].row) {
            currentPath[i].row.classList.add(`hl-${i}`);
          }
        }
      };

      const nameCell = row.insertCell();
      nameCell.style.paddingLeft = (depth * 20 + 4) + 'px';
      
      const nameSpan = document.createElement('span');
      nameSpan.textContent = res.name;

      const valCell = row.insertCell();
      if (Array.isArray(res.value)) {
        const toggle = document.createElement('span');
        toggle.className = 'toggle';
        toggle.textContent = '▼';
        
        nameCell.appendChild(toggle);
        row.childToggle = toggle;
        
        valCell.textContent = '';
        const childRows = addRows(table, res.value, depth + 1, currentPath);
        allDescendantRows.push(...childRows);
        row.directChildren = childRows.filter(r => r.depth === depth + 1);
        row.depth = depth;

        toggle.onclick = (e) => {
          e.stopPropagation();
          const isCollapsed = toggle.textContent === '▼';
          toggle.textContent = isCollapsed ? '▶' : '▼';
          
          const setVisibility = (r, visible) => {
            if (visible) {
              r.classList.remove('row-hidden');
              if (r.childToggle && r.childToggle.textContent === '▼') {
                r.directChildren.forEach(c => setVisibility(c, true));
              }
            } else {
              r.classList.add('row-hidden');
              if (r.directChildren) {
                r.directChildren.forEach(c => setVisibility(c, false));
              }
            }
          };

          row.directChildren.forEach(c => setVisibility(c, !isCollapsed));
        };
      } else {
        const spacer = document.createElement('span');
        spacer.className = 'toggle';
        spacer.style.visibility = 'hidden';
        spacer.textContent = '•';
        nameCell.appendChild(spacer);
        valCell.textContent = res.value;
        row.depth = depth;
      }
      nameCell.appendChild(nameSpan);
    }
    return allDescendantRows;
  };

  for (let section of sections) {
    const header = document.createElement('h2');
    header.textContent = section.title;
    container.appendChild(header);
    const table = document.createElement('table');
    container.appendChild(table);
    addRows(table, section.data);
  }
}

document.addEventListener('dragover', (e) => {
  e.preventDefault();
});

document.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  const reader = new FileReader();
  reader.onload = (e) => {
    loadProfile(e.target.result);
  };
  reader.readAsArrayBuffer(file);
});
</script>
</head>
<body>
  <div id="hex-dump">Drop an ICC profile here</div>
  <div id="results"></div>
</body>
</html>
