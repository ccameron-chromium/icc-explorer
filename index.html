<html>
<head>
<style>
  body { font-family: sans-serif; }
  #main { display: flex; gap: 20px; }
  #hex-dump {
    flex: 0 0 auto;
    width: 58ch;
    font-family: monospace;
    white-space: pre;
    border: 1px solid #ccc;
    padding: 10px;
    height: 80vh;
    overflow-y: auto;
    background: #f9f9f9;
  }
  .hl-base { background: #c8e6c9; }
  .hl-field { background: #ffeb3b; font-weight: bold; }
  #results {
    flex: 1;
    min-width: 0;
    height: 80vh;
    overflow-y: auto;
    border: 1px solid #ccc;
    padding: 10px;
  }
  h2:first-child { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
  th, td { border: 1px solid #ccc; padding: 4px; text-align: left; }
  table table { margin-bottom: 0; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #eee; }
  td:first-child { font-weight: bold; width: 25%; white-space: nowrap; }
  td:last-child { font-family: monospace; word-break: break-all; }
</style>
<script>
let profileBuffer = null;

function readStructureType(structure) {
  return (view, offset) => {
    return readStructure(view, structure, offset);
  };
}

let types = {
  ////////////////////////////////////////////////////////////////////////////////
  // Leaf node types.
  
  'uint8': {
    read: (view, offset) => ({ value: view.getUint8(offset), size: 1 })
  },
  'twocc': {
    read: (view, offset) => ({
      value: String.fromCharCode(view.getUint8(offset),
                                 view.getUint8(offset + 1)),
      size: 2
    })
  },
  'uint16': {
    read: (view, offset) => ({ value: view.getUint16(offset, false), size: 2 })
  },
  'uint32': {
    read: (view, offset) => ({ value: view.getUint32(offset, false), size: 4 })
  },
  's15Fixed16Number': {
    read: (view, offset) => ({ 
      value: (view.getInt32(offset, false) / 65536.0).toFixed(4), 
      size: 4 
    })
  },
  'bitfield32': {
    read: (view, offset) => ({
      value: '0x' + view.getUint32(offset, false).toString(16).padStart(8, '0'),
      size: 4
    })
  },
  'bitfield64': {
    read: (view, offset) => ({
      value: '0x' + view.getUint32(offset, false).toString(16).padStart(8, '0') +
             view.getUint32(offset+4, false).toString(16).padStart(8, '0'),
      size: 8
    })
  },
  'fourcc': {
    read: (view, offset) => {
      let s = '';
      for (let i = 0; i < 4; ++i) {
        let c = view.getUint8(offset + i);
        s += c >= 32 && c <= 126 ?
          String.fromCharCode(c) :
          '\\x' + c.toString(16).padStart(2, '0');
      }
      return { value: s, size: 4 };
    }
  },
  'md5': {
    read: (view, offset) => {
      let s = '';
      for (let i = 0; i < 16; ++i) {
        s += view.getUint8(offset + i).toString(16).padStart(2, '0');
      }
      return { value: s, size: 16 };
    }
  },

  ////////////////////////////////////////////////////////////////////////////////
  // Internal node types.

  'dateTimeNumber': {
    read: readStructureType([
      { name: 'year', type: 'uint16' },
      { name: 'month', type: 'uint16' },
      { name: 'day', type: 'uint16' },
      { name: 'hours', type: 'uint16' },
      { name: 'minutes', type: 'uint16' },
      { name: 'seconds', type: 'uint16' }
    ])
  },
  'XYZNumber': {
    read: readStructureType([
      { name: 'X', type: 's15Fixed16Number' },
      { name: 'Y', type: 's15Fixed16Number' },
      { name: 'Z', type: 's15Fixed16Number' }
    ])
  },
  'XYZ ': {
    read: readStructureType([
      {name: 'Type', type: 'fourcc'},
      {name: 'Reserved', type: 'uint32'},
      {name: 'XYZ', type: 'XYZNumber'}
    ])
  },
  'text': {
    read: readStructureType([
      {name: 'Type', type: 'fourcc'},
      {name: 'Reserved', type: 'uint32'},
      {name: 'ASCII', type: 'uint8', count: 0}
    ])
  },
  'cicp': {
    read: readStructureType([
      {name: 'Type', type: 'fourcc'},
      {name: 'Reserved', type: 'uint32'},
      {name: 'Color Primaries', type: 'uint8'},
      {name: 'Transfer Characteristics', type: 'uint8'},
      {name: 'Matrix Coefficients', type: 'uint8'},
      {name: 'Video Full Range Flag', type: 'uint8'}
    ])
  },
  'mluc': {
    read: readStructureType([
      {name: 'Type', type: 'fourcc'},
      {name: 'Reserved', type: 'uint32'},
      {name: 'Number of records', type: 'uint32'},
      {name: 'Record size', type: 'uint32'},
      {name: 'Records', type: '(mluc record)', count: 'Number of records'},
    ])
  },
  '(mluc record)': {
    read: readStructureType([
      {name: 'language code', type: 'twocc'},
      {name: 'country code', type: 'twocc'},
      {name: 'length', type: 'uint32'},
      {name: 'offset', type: 'uint32'},
    ]),
    onReadStructure: (view, structure, offset) => {
      const length = getStructureValue(structure, 'length');
      const dataOffset = getStructureValue(structure, 'offset');

      let value = '';
      for (let i = 0; i < length; i += 2) {
        value += String.fromCharCode(view.getUint16(offset + dataOffset + i, false));
      }

      return [{ name: 'Value', value: value, offset: offset + dataOffset, size: length }];
    }
  },
  'mAB ': {
    read: readStructureType([
      {name: 'Type',                      type: 'fourcc'},
      {name: 'Reserved',                  type: 'uint32'},
      {name: 'Number of input channels',  type: 'uint8'},
      {name: 'Number of output channels', type: 'uint8'},
      {name: 'Reserved',                  type: 'uint16'},
      {name: 'Offset to B curves',        type: 'uint32'},
      {name: 'Offset to matrix',          type: 'uint32'},
      {name: 'Offset to M curves',        type: 'uint32'},
      {name: 'Offset to CLUT',            type: 'uint32'},
      {name: 'Offset to A curves',        type: 'uint32'},
    ])
  },
  'tagTable': {
    read: readStructureType([
      {name: 'signature', type: 'fourcc'},
      {name: 'offset', type: 'uint32'},
      {name: 'size', type: 'uint32'},
    ]),
    onReadStructure: (view, structure, offset) => {
      const tagOffset = getStructureValue(structure, 'offset');
      const size = getStructureValue(structure, 'size');
      const subValues = readTag(view, tagOffset, size);

      return [{ name:'Tag data', value:subValues, offset:0, size:0 }];
    }
  }
};

let headerStructure = [
  {name: 'Profile size', type: 'uint32'},
  {name: 'Preferred CMM type', type: 'fourcc'},
  {name: 'Profile version number', type: 'uint8', count: 4},
  {name: 'Profile/Device class', type: 'fourcc'},
  {name: 'Colour space of data', type: 'fourcc'},
  {name: 'PCS', type: 'fourcc'},
  {name: 'Date and time', type: 'dateTimeNumber'},
  {name: 'Profile file signature', type: 'fourcc'},
  {name: 'Primary platform', type: 'fourcc'},
  {name: 'Profile flags', type: 'bitfield32'},
  {name: 'Device manufacturer', type: 'fourcc'},
  {name: 'Device model', type: 'fourcc'},
  {name: 'Device attributes', type: 'bitfield64'},
  {name: 'Rendering intent', type: 'uint32'},
  {name: 'PCS illuminant', type: 'XYZNumber'},
  {name: 'Profile creator', type: 'fourcc'},
  {name: 'Profile ID', type: 'md5'},
  {name: 'Reserved', type: 'uint32', count: 7},
  {name: 'Tag count', type: 'uint32'},
  {name: 'Tags', type: 'tagTable', count: 'Tag count'}
];

function getStructureValue(structure, name) {
  const item = structure.find(r => r.name === name);
  return item ? item.value : undefined;
}

// Returns a node in an ICC profile parsed tree. The node corresponds to
// the structure indicated by `structure`
function readStructure(view, structure, startOffset) {
  let offset = startOffset;
  let children = [];
  for (let entry of structure) {
    let count = 1;
    if (typeof entry.count === 'string') {
      const prev = children.find(r => r.name === entry.count);
      count = prev ? prev.value : 0;
    } else if (entry.count !== undefined) {
      count = entry.count;
    }

    const typeDef = types[entry.type];
    let parsedItems = [];
    
    const limit = (count === 0) ? Infinity : count;
    for (let i = 0; i < limit; ++i) {
      if (count === 0 && offset >= view.byteLength) break;
      
      const childOffset = offset;
      const childName = (entry.count === undefined) ? 
        entry.name : `${entry.name}[${i}]`;

      // Read the value and size.
      const { value: structure, size: childSize } = typeDef.read(view, offset);
      offset += childSize;

      if (typeDef.onReadStructure !== undefined) {
        const subItems = typeDef.onReadStructure(view, structure, startOffset);
        for (let j = 0; j < subItems.length; ++j) {
          structure.push(subItems[j]);
        }
      }

      children.push({
        name: childName,
        value: structure,
        offset: childOffset,
        size: childSize
      });
    }
  }
  return { value: children, size: offset - startOffset };
}

function readTag(view, offset, size) {
  const subView = new DataView(view.buffer, view.byteOffset + offset, size);
  const typeSig = types['fourcc'].read(subView, 0).value;

  const typeDef = types[typeSig];
  if (typeDef && typeDef.read) {
    return typeDef.read(subView, 0).value;
  }
  return [
    { name: 'Type', value: typeSig, offset: 0, size: 4 },
    { name: 'Data', value: `[${size} bytes]`, offset: 4, size: size - 4 }
  ];
}

function loadProfile(buffer) {
  profileBuffer = buffer;
  displayHex(buffer);
  const view = new DataView(buffer);
  
  let { value : profileResults } = readStructure(view, headerStructure, 0);

  displayResults([{ title: 'Profile', data: profileResults }]);
}

function displayHex(buffer, fieldHl = null, baseHl = null) {
  const bytes = new Uint8Array(buffer);
  const getHlClass = (idx) => {
    if (fieldHl && idx >= fieldHl.offset && idx < fieldHl.offset + fieldHl.size)
      return 'hl-field';
    if (baseHl && idx >= baseHl.offset && idx < baseHl.offset + baseHl.size)
      return 'hl-base';
    return null;
  };

  let html = '';
  for (let i = 0; i < bytes.length; i += 16) {
    html += i.toString(16).padStart(8, '0') + ': ';
    for (let j = 0; j < 16 && i + j < bytes.length; j++) {
      const idx = i + j;
      const hex = bytes[idx].toString(16).padStart(2, '0');
      const cls = getHlClass(idx);
      
      if (cls) {
        const id = (fieldHl && idx === fieldHl.offset) ? ` id="hl-target"` : '';
        html += `<span class="${cls}"${id}>${hex}</span>`;
      } else {
        html += hex;
      }

      if (j < 15 && i + j + 1 < bytes.length) {
        const c1 = getHlClass(idx);
        const c2 = getHlClass(idx + 1);
        if (c1 && c2) {
          const c = (c1 === 'hl-field' && c2 === 'hl-field') ?
                    'hl-field' : 'hl-base';
          html += `<span class="${c}">,</span>`;
        } else {
          html += ',';
        }
      }
    }
    html += '\n';
  }
  const container = document.getElementById('hex-dump');
  container.innerHTML = html;
  
  const target = document.getElementById('hl-target');
  if (target) target.scrollIntoView({block: 'center'});
}

function displayResults(sections) {
  const container = document.getElementById('results');
  container.innerHTML = '';

  const createTable = (data, parentBase = null) => {
    const table = document.createElement('table');
    for (let res of data) {
      const row = table.insertRow();
      row.className = 'clickable';
      const currentBase = res.base || parentBase;
      
      row.onclick = (e) => {
        e.stopPropagation();
        displayHex(profileBuffer, res, currentBase);
      };

      row.insertCell().textContent = res.name;
      const valCell = row.insertCell();
      
      if (Array.isArray(res.value)) {
        valCell.appendChild(createTable(res.value, currentBase));
        valCell.style.padding = '0'; // Remove padding for nested tables
      } else {
        valCell.textContent = res.value;
      }
    }
    return table;
  };

  for (let section of sections) {
    const h2 = document.createElement('h2');
    h2.textContent = section.title;
    container.appendChild(h2);
    container.appendChild(createTable(section.data, section.base));
  }
}

window.onload = () => {
  const button = document.getElementById('LoadProfile');
  const input = document.createElement('input');
  input.type = 'file';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (file) file.arrayBuffer().then(loadProfile);
  };
  button.onclick = () => input.click();
  button.ondragover = (e) => {
    e.preventDefault();
    button.style.background = '#eee';
  };
  button.ondragleave = () => button.style.background = '';
  button.ondrop = (e) => {
    e.preventDefault();
    button.style.background = '';
    const file = e.dataTransfer.files[0];
    if (file) file.arrayBuffer().then(loadProfile);
  };
};
</script>
</head>
<body>
<p><button id="LoadProfile">Load Profile</button></p>
<div id="main">
  <div id="hex-dump">Hex dump will appear here...</div>
  <div id="results"></div>
</div>
</body>
</html>
