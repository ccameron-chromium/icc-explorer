<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; }
  #hex-dump { flex: 1; overflow-y: scroll; font-family: monospace; white-space: pre; padding: 10px; background: #f0f0f0; }
  #results { flex: 1; overflow-y: scroll; padding: 10px; }
  .hl-field { background: yellow; }
  .hl-base { background: #e0e0ff; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
  th, td { border: 1px solid #ccc; padding: 4px; text-align: left; }
  table table { margin-bottom: 0; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #eee; }
  td:first-child { font-weight: bold; width: 25%; white-space: nowrap; }
  td:last-child { font-family: monospace; word-break: break-all; }
</style>
<script>
let profileBuffer = null;

class Reader {
  constructor(view, offset = 0, parentOffset = 0) {
    this.view = view;
    this.offset = offset;
    this.parentOffset = parentOffset;
  }

  readStructMember(entry, structure) {
    let count = 1;
    if (typeof entry.count === 'string') {
      const prev = structure.find(r => r.name === entry.count);
      count = prev ? prev.value : 0;
    } else if (entry.count !== undefined) {
      count = entry.count;
    }

    const typeDef = types[entry.type];
    const limit = (count === 0) ? Infinity : count;
    for (let i = 0; i < limit; ++i) {
      if (count === 0 && this.offset >= this.view.byteLength) break;

      const childOffset = this.offset;
      const childName = (entry.count === undefined) ?
        entry.name : `${entry.name}[${i}]`;

      let value = typeDef.read(this);
      const childSize = this.offset - childOffset;

      structure.push({
        name: childName,
        value: value,
        offset: childOffset,
        size: childSize
      });

      if (childSize === 0 && limit === Infinity) break;
    }
  }
}

function readStructure(reader, structure) {
  let children = [];
  for (let entry of structure) {
    reader.readStructMember(entry, children);
  }
  return children;
}

function readStructureType(structure) {
  return (reader) => {
    return readStructure(reader, structure);
  };
}

let types = {
  ////////////////////////////////////////////////////////////////////////////////
  // Leaf node types.
  
  'uint8': {
    read: (reader) => {
      const v = reader.view.getUint8(reader.offset);
      reader.offset += 1;
      return v;
    }
  },
  'twocc': {
    read: (reader) => {
      const v = String.fromCharCode(reader.view.getUint8(reader.offset),
                                     reader.view.getUint8(reader.offset + 1));
      reader.offset += 2;
      return v;
    }
  },
  'uint16': {
    read: (reader) => {
      const v = reader.view.getUint16(reader.offset, false);
      reader.offset += 2;
      return v;
    }
  },
  'uint32': {
    read: (reader) => {
      const v = reader.view.getUint32(reader.offset, false);
      reader.offset += 4;
      return v;
    }
  },
  's15Fixed16Number': {
    read: (reader) => {
      const v = (reader.view.getInt32(reader.offset, false) / 65536.0).toFixed(4);
      reader.offset += 4;
      return v;
    }
  },
  'bitfield32': {
    read: (reader) => {
      const v = '0x' + reader.view.getUint32(reader.offset, false).toString(16).padStart(8, '0');
      reader.offset += 4;
      return v;
    }
  },
  'bitfield64': {
    read: (reader) => {
      const v = '0x' + reader.view.getUint32(reader.offset, false).toString(16).padStart(8, '0') +
             reader.view.getUint32(reader.offset + 4, false).toString(16).padStart(8, '0');
      reader.offset += 8;
      return v;
    }
  },
  'fourcc': {
    read: (reader) => {
      let s = '';
      for (let i = 0; i < 4; ++i) {
        let c = reader.view.getUint8(reader.offset + i);
        s += c >= 32 && c <= 126 ?
          String.fromCharCode(c) :
          '\\x' + c.toString(16).padStart(2, '0');
      }
      reader.offset += 4;
      return s;
    }
  },
  'md5': {
    read: (reader) => {
      let s = '';
      for (let i = 0; i < 16; ++i) {
        s += reader.view.getUint8(reader.offset + i).toString(16).padStart(2, '0');
      }
      reader.offset += 16;
      return s;
    }
  },

  ////////////////////////////////////////////////////////////////////////////////
  // Internal node types.

  'dateTimeNumber': {
    read: readStructureType([
      { name: 'year', type: 'uint16' },
      { name: 'month', type: 'uint16' },
      { name: 'day', type: 'uint16' },
      { name: 'hours', type: 'uint16' },
      { name: 'minutes', type: 'uint16' },
      { name: 'seconds', type: 'uint16' }
    ])
  },
  'XYZNumber': {
    read: readStructureType([
      { name: 'X', type: 's15Fixed16Number' },
      { name: 'Y', type: 's15Fixed16Number' },
      { name: 'Z', type: 's15Fixed16Number' }
    ])
  },

  ////////////////////////////////////////////////////////////////////////////////
  // Tag types

  'XYZ ': {
    read: readStructureType([
      {name: 'Type', type: 'fourcc'},
      {name: 'Reserved', type: 'uint32'},
      {name: 'XYZ', type: 'XYZNumber'}
    ])
  },
  'text': {
    read: readStructureType([
      {name: 'Type', type: 'fourcc'},
      {name: 'Reserved', type: 'uint32'},
      {name: 'ASCII', type: 'uint8', count: 0}
    ])
  },
  'curv': {
    read: readStructureType([
      {name: 'Type', type: 'fourcc'},
      {name: 'Reserved', type: 'uint32'},
      // TODO: Add the fixed parts of the curv structure.
    ])
    // TODO: Add the dynamic parts (the table or the formula).
  },
  'cicp': {
    read: readStructureType([
      {name: 'Type', type: 'fourcc'},
      {name: 'Reserved', type: 'uint32'},
      {name: 'Color Primaries', type: 'uint8'},
      {name: 'Transfer Characteristics', type: 'uint8'},
      {name: 'Matrix Coefficients', type: 'uint8'},
      {name: 'Video Full Range Flag', type: 'uint8'}
    ])
  },
  'mluc': {
    read: (reader) => {
      const startOffset = reader.offset;
      const structure = readStructure(reader, [
        {name: 'Type', type: 'fourcc'},
        {name: 'Reserved', type: 'uint32'},
        {name: 'Number of records', type: 'uint32'},
        {name: 'Record size', type: 'uint32'},
      ]);
      const numRecords = getStructMember(structure, 'Number of records').value;
      const recordReader = new Reader(reader.view, reader.offset, startOffset);
      const records = [];
      for (let i = 0; i < numRecords; ++i) {
        recordReader.readStructMember({name: `Record[${i}]`, type: '(mluc record)'}, records);
      }
      reader.offset = recordReader.offset;
      structure.push({ name: 'Records', value: records, offset: startOffset + 16, size: reader.offset - (startOffset + 16) });
      return structure;
    }
  },
  '(mluc record)': {
    read: (reader) => {
      let structure = readStructure(reader, [
        {name: 'language code', type: 'twocc'},
        {name: 'country code', type: 'twocc'},
        {name: 'length', type: 'uint32'},
        {name: 'offset', type: 'uint32'},
      ]);
/*
      const length = getStructMember(structure, 'length').value;
      const dataOffset = getStructMember(structure, 'offset').value;
      let value = '';
      for (let i = 0; i < length; i += 2) {
        value += String.fromCharCode(reader.view.getUint16(reader.parentOffset + dataOffset + i, false));
      }
      structure.push({ name: 'Value', value: value, offset: reader.parentOffset + dataOffset, size: length });
*/
      return structure;
    }
  },
  'mAB ': {
    read: (reader) => {
      const startOffset = reader.offset;
      let structure = readStructure(reader, [
        {name: 'Type',                      type: 'fourcc'},
        {name: 'Reserved',                  type: 'uint32'},
        {name: 'Number of input channels',  type: 'uint8'},
        {name: 'Number of output channels', type: 'uint8'},
        {name: 'Reserved',                  type: 'uint16'},
        {name: 'Offset to B curves',        type: 'uint32'},
        {name: 'Offset to matrix',          type: 'uint32'},
        {name: 'Offset to M curves',        type: 'uint32'},
        {name: 'Offset to CLUT',            type: 'uint32'},
        {name: 'Offset to A curves',        type: 'uint32'},
      ]);
      const stopOffset = reader.offset;

      const aCurveOffset = getStructMember(structure, 'Offset to A curves').value;
      if (aCurveOffset !== 0) {
        reader.offset = startOffset + aCurveOffset;
        let aCurves = readStructure(reader, [
          {name: 'A curve', type: '(tag)'},
        ]);
        structure.push({ name: 'A curves', value: aCurves, offset: 0, size: 0 });
      }

/*
      const inputChannels = getStructMember(structure, 'Number of input channels').value;
      const aCurveOffset = getStructMember(structure, 'Offset to A curves').value;
      if (aCurveOffset !== 0) {
        const aCurveReader = new Reader(reader.view, startOffset + aCurveOffset);
        const aCurves = [];
        for (let i = 0; i < inputChannels; ++i) {
          aCurveReader.readStructMember({name: `A-curve offset[${i}]`, type: 'uint32'}, aCurves);
        }
        structure.push({ name: 'A curves', value: aCurves, offset: startOffset + aCurveOffset, size: aCurveReader.offset - (startOffset + aCurveOffset) });
      }
*/
      return structure;
    }
  },
  '(tag table entry)': {
    read: (reader) => {
      let structure = readStructure(reader, [
        {name: 'signature', type: 'fourcc'},
        {name: 'offset', type: 'uint32'},
        {name: 'size', type: 'uint32'},
      ]);

      const tagOffset = getStructMember(structure, 'offset').value;
      const tagSize = getStructMember(structure, 'size').value;

      const subView = new DataView(reader.view.buffer, reader.view.byteOffset + tagOffset, tagSize);
      const tagReader = new Reader(subView, 0);
      const tagSignature = types['fourcc'].read(tagReader);
      tagReader.offset -= 4;
      const typeDef = types[tagSignature];
      if (typeDef && typeDef.read) {
        tagData = typeDef.read(tagReader);
        structure.push({ name: 'Tag data', value: tagData, offset: tagOffset, size: tagSize });
      }
      return structure;
    }
  },
  '(tag)': {
    read: (reader) => {
      const tagSignature = types['fourcc'].read(reader);
      reader.offset -= 4;
      const typeDef = types[tagSignature];
      if (typeDef && typeDef.read) {
        return typeDef.read(tagReader);
      }
      return [
        { name: 'Unknown tag', value: tagSignature, offset: 0, size: 0 },
        { name: 'Data', value: `[bytes]`, offset: 0, size: 0 }
      ];
    }
  }
};

let headerStructure = [
  {name: 'Profile size', type: 'uint32'},
  {name: 'Preferred CMM type', type: 'fourcc'},
  {name: 'Profile version number', type: 'uint8', count: 4},
  {name: 'Profile/Device class', type: 'fourcc'},
  {name: 'Colour space of data', type: 'fourcc'},
  {name: 'PCS', type: 'fourcc'},
  {name: 'Date and time', type: 'dateTimeNumber'},
  {name: 'Profile file signature', type: 'fourcc'},
  {name: 'Primary platform', type: 'fourcc'},
  {name: 'Profile flags', type: 'bitfield32'},
  {name: 'Device manufacturer', type: 'fourcc'},
  {name: 'Device model', type: 'fourcc'},
  {name: 'Device attributes', type: 'bitfield64'},
  {name: 'Rendering intent', type: 'uint32'},
  {name: 'PCS illuminant', type: 'XYZNumber'},
  {name: 'Profile creator', type: 'fourcc'},
  {name: 'Profile ID', type: 'md5'},
  {name: 'Reserved', type: 'uint32', count: 7},
  {name: 'Tag count', type: 'uint32'},
  {name: 'Tags', type: '(tag table entry)', count: 'Tag count'}
];

function getStructMember(structure, name) {
  return structure.find(r => r.name === name);
}

function loadProfile(buffer) {
  profileBuffer = buffer;
  displayHex(buffer);

  const reader = new Reader(new DataView(buffer), 0);
  let profileResults = readStructure(reader, headerStructure);

  displayResults([{ title: 'Profile', data: profileResults }]);
}

function displayHex(buffer, fieldHl = null, baseHl = null) {
  const bytes = new Uint8Array(buffer);
  const getHlClass = (idx) => {
    if (fieldHl && idx >= fieldHl.offset && idx < fieldHl.offset + fieldHl.size)
      return 'hl-field';
    if (baseHl && idx >= baseHl.offset && idx < baseHl.offset + baseHl.size)
      return 'hl-base';
    return null;
  };

  let html = '';
  for (let i = 0; i < bytes.length; i += 16) {
    html += i.toString(16).padStart(8, '0') + ': ';
    for (let j = 0; j < 16 && i + j < bytes.length; j++) {
      const idx = i + j;
      const hex = bytes[idx].toString(16).padStart(2, '0');
      const cls = getHlClass(idx);
      
      if (cls) {
        const id = (fieldHl && idx === fieldHl.offset) ? ` id="hl-target"` : '';
        html += `<span class="${cls}"${id}>${hex}</span>`;
      } else {
        html += hex;
      }

      if (j < 15 && i + j + 1 < bytes.length) {
        const c1 = getHlClass(idx);
        const c2 = getHlClass(idx + 1);
        if (c1 && c2) {
          const c = (c1 === 'hl-field' && c2 === 'hl-field') ?
                    'hl-field' : 'hl-base';
          html += `<span class="${c}">,</span>`;
        } else {
          html += ',';
        }
      }
    }
    html += '\n';
  }
  const container = document.getElementById('hex-dump');
  container.innerHTML = html;
  
  const target = document.getElementById('hl-target');
  if (target) target.scrollIntoView({block: 'center'});
}

function displayResults(sections) {
  const container = document.getElementById('results');
  container.innerHTML = '';

  const createTable = (data, parentBase = null) => {
    const table = document.createElement('table');
    for (let res of data) {
      const row = table.insertRow();
      row.className = 'clickable';
      const currentBase = res.base || parentBase;
      
      row.onclick = (e) => {
        e.stopPropagation();
        displayHex(profileBuffer, res, currentBase);
      };

      row.insertCell().textContent = res.name;
      const valCell = row.insertCell();
      
      if (Array.isArray(res.value)) {
        valCell.appendChild(createTable(res.value, currentBase));
        valCell.style.padding = '0'; // Remove padding for nested tables
      } else {
        valCell.textContent = res.value;
      }
    }
    return table;
  };

  for (let section of sections) {
    const header = document.createElement('h2');
    header.textContent = section.title;
    container.appendChild(header);
    container.appendChild(createTable(section.data));
  }
}

document.addEventListener('dragover', (e) => {
  e.preventDefault();
});

document.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  const reader = new FileReader();
  reader.onload = (e) => {
    loadProfile(e.target.result);
  };
  reader.readAsArrayBuffer(file);
});
</script>
</head>
<body>
  <div id="hex-dump">Drop an ICC profile here</div>
  <div id="results"></div>
</body>
</html>
